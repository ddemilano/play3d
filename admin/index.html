<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play3D Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--ink:#10251f;--muted:#688078;--mint:#57c99d;--mint2:#dff8ed;--sky:#e8f8ff;--paper:#f7fbfa;--line:rgba(16,37,31,.12);--shadow:0 18px 55px rgba(25,63,53,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky),var(--paper) 36%,#eff9f4)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.page{width:min(1180px,calc(100% - 28px));margin:auto}
.top{position:sticky;top:0;z-index:10;background:rgba(247,251,250,.75);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.8)}
.bar{height:74px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;letter-spacing:-.04em}.mark{width:30px;height:30px;border-radius:10px;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}.mark:before{content:"";width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid var(--ink)}
.actions{display:flex;align-items:center;gap:8px}.ghost,.primary,.danger{border:1px solid var(--line);border-radius:13px;padding:10px 14px;background:rgba(255,255,255,.7)}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.danger{color:#a23b3b;background:#fff}
main{padding:34px 0 70px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.head h1{font-size:clamp(2rem,4vw,3.3rem);margin:8px 0 0;letter-spacing:-.05em}.kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#4b7568}
.layout{display:grid;grid-template-columns:1fr 1.35fr;gap:20px;align-items:start}
.panel{background:rgba(255,255,255,.64);border:1px solid rgba(255,255,255,.9);border-radius:26px;box-shadow:var(--shadow);padding:22px}.panel h2{margin:0 0 16px;letter-spacing:-.03em}
.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:.8rem;font-weight:800;color:#45655c}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:13px;padding:12px 13px;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(87,201,157,.9);box-shadow:0 0 0 4px rgba(87,201,157,.12)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toggles{display:flex;gap:10px;flex-wrap:wrap}.toggle{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.72);border:1px solid var(--line);padding:9px 11px;border-radius:13px;font-size:.84rem}.toggle input{accent-color:var(--mint)}
.drop{border:1.5px dashed rgba(52,103,90,.35);background:linear-gradient(135deg,rgba(232,248,255,.72),rgba(223,248,237,.72));padding:24px;border-radius:20px;text-align:center}.drop strong{display:block;font-size:1rem}.drop span{display:block;color:var(--muted);font-size:.8rem;margin-top:5px}.drop input{display:none}.drop button{margin-top:14px}
.file-status{margin-top:10px;font-size:.78rem;color:var(--muted)}.progress{height:8px;background:rgba(16,37,31,.08);border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:var(--mint);transition:width .2s}
.thumb{margin-top:12px;aspect-ratio:1/.72;border-radius:18px;background-image:linear-gradient(45deg,#fff 25%,#eef3f2 25%,#eef3f2 50%,#fff 50%,#fff 75%,#eef3f2 75%);background-size:18px 18px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.list{display:grid;gap:12px}.product{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;background:rgba(255,255,255,.62);border:1px solid var(--line);padding:12px;border-radius:18px}.product .pic{width:96px;height:96px;border-radius:14px;overflow:hidden;background:linear-gradient(145deg,#e8f8ff,#eff9f4);display:grid;place-items:center}.pic img{width:100%;height:100%;object-fit:contain}.pic span{font-size:.65rem;color:#72827c;letter-spacing:.08em}.product h3{margin:0 0 6px;font-size:.98rem}.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}.meta b{color:var(--ink)}.pactions{display:flex;gap:6px}.mini{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:.75rem}.empty{padding:44px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);padding:28px;border-radius:28px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow)}.login-card h1{font-size:2.2rem;letter-spacing:-.05em;margin:10px 0}.note{color:var(--muted);font-size:.86rem;line-height:1.45}.msg{min-height:20px;margin:8px 0;color:#a23b3b;font-size:.82rem}.hidden{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
@media(max-width:620px){.bar{height:68px}.row{grid-template-columns:1fr}.product{grid-template-columns:72px 1fr}.product .pic{width:72px;height:72px}.pactions{grid-column:1/-1}.actions .ghost{display:none}}
</style>
</head>
<body>
<section id="loginView" class="login">
  <div class="login-card">
    <div class="brand"><span class="mark"></span><b>Play<span style="color:#57c99d">3D</span> Admin</b></div>
    <h1>Entrar</h1>
    <p class="note">Panel privado para administrar productos, precios, stock y fotos.</p>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" value="ddemilano@gmail.com" autocomplete="username"></div>
    <div class="field"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
    <div id="loginMsg" class="msg"></div>
    <button id="loginBtn" class="primary" style="width:100%">ENTRAR</button>
    <button id="resetBtn" class="ghost" style="width:100%;margin-top:9px">ENVIAR ENLACE PARA RESTABLECER CONTRASEÑA</button>
  </div>
</section>

<div id="adminView" class="hidden">
  <div class="top"><div class="page bar">
    <div class="brand"><span class="mark"></span><b>Play<span style="color:#57c99d">3D</span> Admin</b></div>
    <div class="actions"><a class="ghost" href="/" target="_blank">VER TIENDA ↗</a><button id="logoutBtn" class="ghost">SALIR</button></div>
  </div></div>
  <main class="page">
    <div class="head"><div><div class="kicker">GESTIÓN DE TIENDA</div><h1>Productos</h1></div><button id="newBtn" class="primary">+ NUEVO PRODUCTO</button></div>
    <div class="layout">
      <section class="panel">
        <h2 id="formTitle">Nuevo producto</h2>
        <form id="productForm">
          <input id="productId" type="hidden">
          <div class="field"><label>Nombre</label><input id="name" required placeholder="Ej. Lionel Messi · Celebración Clásica"></div>
          <div class="row">
            <div class="field"><label>Precio</label><input id="price" type="number" min="0" step="0.01" required placeholder="46000"></div>
            <div class="field"><label>Stock</label><input id="stock" type="number" min="0" step="1" required placeholder="5"></div>
          </div>
          <div class="row">
            <div class="field"><label>Categoría</label><input id="category" list="categories" value="FIGURAS 3D"><datalist id="categories"><option value="FIGURAS 3D"><option value="PERSONALIZADOS"><option value="ACCESORIOS"></datalist></div>
            <div class="field"><label>Medidas</label><input id="dimensions" placeholder="30 × 18 × 15 cm"></div>
          </div>
          <div class="field"><label>Descripción</label><textarea id="description" placeholder="Descripción del producto..."></textarea></div>
          <div class="toggles">
            <label class="toggle"><input id="published" type="checkbox" checked> Publicado</label>
            <label class="toggle"><input id="featured" type="checkbox"> Destacado</label>
          </div>
          <div class="field" style="margin-top:17px">
            <label>Foto principal</label>
            <div class="drop" id="drop">
              <strong>Subí la foto original</strong>
              <span>El sistema la procesa automáticamente y crea la versión transparente.</span>
              <button type="button" class="ghost" id="chooseBtn">SELECCIONAR FOTO</button>
              <input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
            </div>
            <div id="fileStatus" class="file-status">Sin foto nueva.</div>
            <div class="progress"><i id="progress"></i></div>
            <div id="thumbWrap" class="thumb hidden"><img id="thumb"></div>
          </div>
          <button id="saveBtn" class="primary" style="width:100%">GUARDAR PRODUCTO</button>
          <button id="cancelBtn" type="button" class="ghost hidden" style="width:100%;margin-top:9px">CANCELAR EDICIÓN</button>
        </form>
      </section>
      <section class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px"><h2 style="margin:0">Catálogo</h2><input id="search" placeholder="Buscar..." style="max-width:230px;border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:12px"></div>
        <div id="list" class="list"></div>
      </section>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/ort.min.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { remove, newSession, rembgConfig } from 'https://cdn.jsdelivr.net/npm/@bunnio/rembg-web@latest/+esm';

const SUPABASE_URL='https://fynbhcnwpnhgjhzrrbjg.supabase.co';
const SUPABASE_KEY='sb_publishable_qW61dEsKBzaimdgrVlKOaw_cbPOPWds';
const BUCKET='play3d-products';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
rembgConfig.setCustomModelPath('u2netp','https://github.com/bunn-io/rembg-web/releases/download/base-models/u2netp.onnx');

const $=id=>document.getElementById(id);
const loginView=$('loginView'), adminView=$('adminView'), loginMsg=$('loginMsg');
const form=$('productForm'), list=$('list'), photo=$('photo'), progress=$('progress'), fileStatus=$('fileStatus'), thumbWrap=$('thumbWrap'), thumb=$('thumb');
let selectedFile=null;

function escapeHtml(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function slugify(v){return v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function money(n){return '$'+Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:0})}
function showLogin(msg=''){loginView.classList.remove('hidden');adminView.classList.add('hidden');loginMsg.textContent=msg}
function showAdmin(){loginView.classList.add('hidden');adminView.classList.remove('hidden')}

async function checkAdmin(sessionOverride=null){
 const session=sessionOverride ?? (await supabase.auth.getSession()).data.session;
 if(!session){showLogin();return false}
 const {data,error}=await supabase.rpc('is_play3d_admin');
 if(error){showLogin('No se pudo verificar el acceso al panel: '+error.message);return false}
 if(data!==true){await supabase.auth.signOut();showLogin('Esta cuenta no tiene acceso al panel Play3D.');return false}
 showAdmin(); loginMsg.textContent=''; await loadProducts(); return true;
}

$('loginBtn').onclick=async()=>{
 const btn=$('loginBtn');
 btn.disabled=true;
 btn.textContent='INGRESANDO…';
 loginMsg.textContent='';
 const email=$('loginEmail').value.trim();
 const password=$('loginPassword').value;
 const {data,error}=await supabase.auth.signInWithPassword({email,password});
 if(error){
   loginMsg.textContent=error.message;
   btn.disabled=false;
   btn.textContent='ENTRAR';
   return;
 }
 await checkAdmin(data.session);
 btn.disabled=false;
 btn.textContent='ENTRAR';
};
$('resetBtn').onclick=async()=>{
 const email=$('loginEmail').value.trim();
 if(!email){loginMsg.textContent='Ingresá primero tu email.';return}
 const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/admin/'});
 loginMsg.textContent=error?error.message:'Te enviamos un enlace para restablecer la contraseña.';
};
$('logoutBtn').onclick=async()=>{await supabase.auth.signOut();showLogin()};
supabase.auth.onAuthStateChange(()=>{});
function resetForm(){
 form.reset();$('productId').value='';$('category').value='FIGURAS 3D';$('published').checked=true;
 $('featured').checked=false;$('formTitle').textContent='Nuevo producto';$('cancelBtn').classList.add('hidden');
 selectedFile=null;photo.value='';fileStatus.textContent='Sin foto nueva.';progress.style.width='0';thumbWrap.classList.add('hidden');
}
$('newBtn').onclick=resetForm;
$('cancelBtn').onclick=resetForm;

$('chooseBtn').onclick=()=>photo.click();
photo.onchange=()=>{selectedFile=photo.files?.[0]||null;if(selectedFile){fileStatus.textContent=selectedFile.name+' · '+Math.round(selectedFile.size/1024)+' KB';const u=URL.createObjectURL(selectedFile);thumb.src=u;thumbWrap.classList.remove('hidden')}};

const drop=$('drop');
drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='#57c99d'};
drop.ondragleave=()=>drop.style.borderColor='';
drop.ondrop=e=>{e.preventDefault();drop.style.borderColor='';const f=e.dataTransfer.files?.[0];if(f&&f.type.startsWith('image/')){selectedFile=f;fileStatus.textContent=f.name+' · '+Math.round(f.size/1024)+' KB';thumb.src=URL.createObjectURL(f);thumbWrap.classList.remove('hidden')}};

async function processAndUpload(file,productId){
 progress.style.width='5%';fileStatus.textContent='Procesando automáticamente…';
 const session=newSession('u2netp');
 const result=await remove(file,{session,postProcessMask:true,onProgress:info=>{const p=Math.max(5,Math.min(92,Math.round(info.progress)));progress.style.width=p+'%';fileStatus.textContent=info.message||'Procesando automáticamente…'}});
 progress.style.width='94%';fileStatus.textContent='Guardando original y versión transparente…';
 const ext=(file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg');
 const base=productId+'/'+Date.now();
 const originalPath='original/'+base+'.'+ext;
 const transparentPath='transparent/'+base+'.png';
 const original={path:originalPath,blob:file,type:file.type||'image/jpeg'};
 const transparent={path:transparentPath,blob:result,type:'image/png'};
 for(const a of [original,transparent]){
   const {error}=await supabase.storage.from(BUCKET).upload(a.path,a.blob,{upsert:true,contentType:a.type,cacheControl:'31536000'});
   if(error) throw error;
 }
 const originalUrl=supabase.storage.from(BUCKET).getPublicUrl(originalPath).data.publicUrl;
 const transparentUrl=supabase.storage.from(BUCKET).getPublicUrl(transparentPath).data.publicUrl;
 progress.style.width='100%';fileStatus.textContent='Foto lista.';
 return {originalPath,originalUrl,transparentPath,transparentUrl};
}

async function loadProducts(){
 const {data,error}=await supabase.from('play3d_products').select('*').order('created_at',{ascending:false});
 if(error){list.innerHTML='<div class="empty">'+escapeHtml(error.message)+'</div>';return}
 window.__products=data||[];renderProducts();
}
function renderProducts(){
 const q=($('search').value||'').toLowerCase();
 const items=(window.__products||[]).filter(p=>(p.name+' '+p.category).toLowerCase().includes(q));
 if(!items.length){list.innerHTML='<div class="empty">No hay productos para mostrar.</div>';return}
 list.innerHTML=items.map(p=>{
   const pic=p.main_image_url?'<img src="'+escapeHtml(p.main_image_url)+'" alt="">':'<span>PLAY3D</span>';
   return '<article class="product"><div class="pic">'+pic+'</div><div><h3>'+escapeHtml(p.name)+'</h3><div class="meta"><span><b>'+money(p.price)+'</b></span><span>Stock <b>'+p.stock+'</b></span><span>'+escapeHtml(p.category)+'</span><span>'+ (p.published?'Publicado':'Oculto') +'</span></div></div><div class="pactions"><button class="mini" data-edit="'+p.id+'">Editar</button><button class="mini" data-hide="'+p.id+'">'+(p.published?'Ocultar':'Publicar')+'</button></div></article>';
 }).join('');
 list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));
 list.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>togglePublish(b.dataset.hide));
}
$('search').oninput=renderProducts;

function editProduct(id){
 const p=(window.__products||[]).find(x=>x.id===id);if(!p)return;
 $('productId').value=p.id;$('name').value=p.name;$('price').value=p.price;$('stock').value=p.stock;
 $('category').value=p.category;$('dimensions').value=p.dimensions;$('description').value=p.description;
 $('published').checked=p.published;$('featured').checked=p.featured;$('formTitle').textContent='Editar producto';
 $('cancelBtn').classList.remove('hidden');selectedFile=null;photo.value='';fileStatus.textContent=p.main_image_url?'Foto actual cargada.':'Sin foto.';progress.style.width='0';
 if(p.main_image_url){thumb.src=p.main_image_url;thumbWrap.classList.remove('hidden')}else thumbWrap.classList.add('hidden');
 scrollTo({top:0,behavior:'smooth'});
}
async function togglePublish(id){
 const p=(window.__products||[]).find(x=>x.id===id);if(!p)return;
 const {error}=await supabase.from('play3d_products').update({published:!p.published}).eq('id',id);
 if(error)alert(error.message);else loadProducts();
}

form.onsubmit=async e=>{
 e.preventDefault();
 const save=$('saveBtn');save.disabled=true;save.textContent='GUARDANDO…';
 try{
   const payload={name:$('name').value.trim(),slug:slugify($('name').value.trim()),price:Number($('price').value||0),stock:Number($('stock').value||0),category:$('category').value.trim()||'FIGURAS 3D',dimensions:$('dimensions').value.trim(),description:$('description').value.trim(),published:$('published').checked,featured:$('featured').checked};
   if(!payload.name)throw new Error('El nombre es obligatorio.');
   let id=$('productId').value;
   if(id){
     const {error}=await supabase.from('play3d_products').update(payload).eq('id',id);if(error)throw error;
   }else{
     const {data,error}=await supabase.from('play3d_products').insert(payload).select('id').single();if(error)throw error;id=data.id;$('productId').value=id;
   }
   if(selectedFile){
     const assets=await processAndUpload(selectedFile,id);
     const {error}=await supabase.from('play3d_products').update({main_image_path:assets.transparentPath,main_image_url:assets.transparentUrl,original_image_path:assets.originalPath,original_image_url:assets.originalUrl}).eq('id',id);
     if(error)throw error;
     await supabase.from('play3d_product_images').insert([{product_id:id,path:assets.originalPath,public_url:assets.originalUrl,sort_order:0,kind:'original'},{product_id:id,path:assets.transparentPath,public_url:assets.transparentUrl,sort_order:1,kind:'transparent'}]);
   }
   resetForm();await loadProducts();save.textContent='GUARDADO ✓';setTimeout(()=>save.textContent='GUARDAR PRODUCTO',1200);
 }catch(err){alert(err?.message||String(err));}
 save.disabled=false;if(save.textContent!=='GUARDADO ✓')save.textContent='GUARDAR PRODUCTO';
};

checkAdmin();
</script>
</body>
</html>
